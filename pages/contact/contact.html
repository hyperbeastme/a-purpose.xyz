<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Darrius Parker</title>

    <link rel="stylesheet" href="https://use.typekit.net/tzd0qdu.css">
    <link rel="stylesheet" href="/css/components/header.css" media="screen and (min-width:768px) and (orientation:landscape)">
    <link rel="stylesheet" href="/css/components/footer.css" media="screen and (min-width:768px) and (orientation:landscape)">

    <link rel="stylesheet" href="/css/pages/contact/contact.css" media="screen and (min-width:768px) and (orientation:landscape)">
    <script src="/js/image-lightbox.js" defer></script>
    <link rel="stylesheet" href="/css/pages/contact/contact-mobile.css" media="screen and (max-width:767px), screen and (orientation:portrait)">
</head>

<body>

<header class="header">

    <div class="header-left">
        <a href="/">a-purpose.xyz</a>
    </div>

    <div class="header-center">
        Contact
    </div>

    <nav class="header-right">
        <a href="/pages/work/work.html">work</a>
        <a href="/pages/about/about.html">about</a>
        <a href="/">home</a>

        <a href="https://www.linkedin.com/in/darrius-parker-9aa7012a0/">
            <img src="/assets/icons/linkedin.svg" alt="LinkedIn">
        </a>

        <a href="https://www.instagram.com/djay1k">
            <img src="/assets/icons/instagram.svg" alt="Instagram">
        </a>
    </nav>

</header>

    <main class="contact-page">

        <section class="contact-intro">

            <p>For collaborations, employment and all other inquiries:</p>

        </section>

        <form

                 action="https://formspree.io/f/mwvgjqap"
                 method="POST"
        >

            <div class="form-field">
                <label for="contact-name">Name</label>

                <input
                    id="contact-name"
                    type="text"
                    name="name"
                    required
                >
            </div>

            <div class="form-field">
                <label for="contact-email">Email</label>

                <input
                    id="contact-email"
                    type="email"
                    name="email"
                    required
                >
            </div>

            <div class="form-field">
                <label for="contact-subject">Subject</label>

                <input
                    id="contact-subject"
                    type="text"
                    name="subject"
                >
            </div>

            <div class="form-field">
                <label for="contact-message">Message</label>

                <textarea
                    id="contact-message"
                    name="message"
                    rows="8"
                    required
                ></textarea>
            </div>

            <input
                type="hidden"
                name="_subject"
                value="New portfolio inquiry"
            >

            <button type="submit">
                Send message
            </button>

        </form>

    </main>

    <footer class="footer">

        <div class="footer-main">

            <a class="footer-name" href="/pages/about/about.html">
           darrius parker
        </a>

            <span class="footer-divider" aria-hidden="true"></span>

            <a class="footer-social" href="https://www.linkedin.com/in/darrius-parker-9aa7012a0/" target="_blank" rel="noopener noreferrer">
                <img src="/assets/icons/linkedin.svg" alt="LinkedIn">
            </a>

            <span class="footer-divider" aria-hidden="true"></span>

            <a class="footer-social" href="https://www.instagram.com/djay1k" target="_blank" rel="noopener noreferrer">
                <img src="/assets/icons/instagram.svg" alt="Instagram">
            </a>

            <span class="footer-divider" aria-hidden="true"></span>

            <a class="contact.html" href="/pages/contact/contact.html">
                contact@a-purpose.xyz
            </a>

        </div>

        <p class="footer-copyright">
            &copy; 2026 a-purpose.xyz
        </p>

    </footer>

</body>
</html>
